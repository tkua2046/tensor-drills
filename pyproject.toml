[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-drills"
version = "0.2.0"
description = "Hands-on NumPy and PyTorch exercises with local checks"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
numpy = ["numpy"]
pytorch = ["torch"]

[project.scripts]
tensor-drills = "tensor_drills.cli:main"

[tool.setuptools]
packages = ["tensor_drills"]
include-package-data = false

[tool.setuptools.package-data]
tensor_drills = [
    "practice/README.md",
    "practice/drills/**/*.md",
    "practice/drills/**/*.json",
    "practice/drills/**/*.py",
]
